# 每月 1 號抓 Spotify 全球週榜前 5 名，更新首頁的熱門歌曲；push 後 Vercel 會自動部署
name: 更新本月熱門歌曲

on:
  schedule:
    - cron: '0 2 1 * *' # 每月 1 號 UTC 02:00（台灣 10:00）
  workflow_dispatch: # 可在 GitHub → Actions 手動執行

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: 抓取排行榜
        run: node scripts/update-top-songs.mjs

      - name: 有變更就 commit 並 push
        run: |
          if git diff --quiet -- src/data/top-songs.json; then
            echo "歌單沒有變更"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/data/top-songs.json
          git commit -m '更新本月熱門歌曲'
          # 執行期間若有人 push，先接上最新的 main 再推
          git pull --rebase
          git push
